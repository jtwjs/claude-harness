# Confluence "적용 4단계 — Deny List" 정책 구현.
# 같은 폴더의 block-dangerous-bash.sh 가 이 파일을 읽어 Bash 명령을 차단한다.
#
# ⚠️ 이 목록은 "사고 방지"용이지 보안 경계가 아니다. 정규식은 우회된다. 막아야 할 것은 권한으로 막는다.
#
# 항목 필드:
#   id            : 짧은 식별자 (kebab-case)
#   pattern       : POSIX ERE (grep -E) 정규식. 한 명령 안에서 매칭되면 발동.
#                   `.*` 대신 `[^|;&]*` 를 쓴다 — `&&`·`;`·`|` 뒤의 다른 명령까지 번지지 않게.
#   match_all     : (선택) 같이 매칭돼야 차단 발동. 정규식 배열.
#   exclude       : (선택) 이 정규식이 매칭되면 차단하지 않는다 (ERE 에 부정 선행이 없어서 둔 자리).
#   ignore_quoted : (선택) true 면 작은따옴표·큰따옴표 안 문자열을 비우고 매칭한다.
#                   문자열 안의 텍스트(커밋 메시지, printf 인자)가 플래그로 읽히는 오탐을 막는다.
#                   파일 경로가 따옴표에 싸이는 패턴(secret-file-read)에는 켜지 않는다.
#   title         : 사용자에게 표시될 차단 사유 한 줄
#   reason        : 왜 금지인지 (사고 이력·정책)
#
# 추가/수정 시: hook 스크립트는 변경 없이 이 파일만 고치면 됨.

patterns:
  - id: protected-force-push
    pattern: 'git[[:space:]]+push[[:space:]].*(-f\b|--force\b|--force-with-lease\b)'
    match_all:
      - '(\b|/)(main|develop)\b'
    title: "main/develop force push"
    reason: "보호 브랜치 force push 금지. hotfix 브랜치 → PR로 처리."

  - id: reset-hard-remote
    pattern: "git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(origin|upstream)/"
    title: "git reset --hard <remote>/<branch>"
    reason: "원격 기준 강제 리셋은 작업 손실 위험. 백업·검토 후 수동으로."

  - id: protected-branch-delete
    pattern: 'git[[:space:]]+branch[[:space:]]+-D[[:space:]]+(main|develop)\b'
    title: "보호 브랜치 강제 삭제"
    reason: "main/develop 로컬 강제 삭제 차단."

  - id: commit-no-verify
    pattern: 'git[[:space:]]+commit[[:space:]][^|;&]*(\B-n\b|\B--no-verify\b)'
    ignore_quoted: true
    title: "git commit --no-verify"
    reason: "pre-commit hook 우회 금지. hook 실패 시 원인 수정 후 재커밋. (CLAUDE.md 정책)"

  - id: rm-rf-root-home
    pattern: 'rm[[:space:]]+-r[fR]*[[:space:]]+(/|~|\$HOME)([[:space:]]|$)'
    title: "rm -rf 루트/홈 디렉터리"
    reason: "치명적 재귀 삭제 차단."

  - id: secret-file-read
    pattern: '(\bcat\b|\bless\b|\bmore\b|\bhead\b|\btail\b|\bbat\b|\bxxd\b|\bnl\b|\bstrings\b)[[:space:]][^|;&]*(\.env(\.[A-Za-z0-9_.-]+)?|id_rsa|id_ed25519|\.pem|\.p12|credentials(\.json)?)(\b|$)'
    exclude: '\.env\.(example|sample|template|dist)\b'
    title: "비밀 파일 내용 출력 (.env·개인키·credentials)"
    reason: "환경변수·개인키·자격증명을 콘솔/로그로 노출 금지. 한 번 노출되면 회수·교체 비용이 크다. 값 확인은 안전한 경로로."
