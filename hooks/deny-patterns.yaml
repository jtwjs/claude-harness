# Confluence "적용 4단계 — Deny List" 정책 구현.
# 같은 폴더의 block-dangerous-bash.sh 가 이 파일을 읽어 Bash 명령을 차단한다.
#
# ⚠️ 이 목록은 "사고 방지"용이지 보안 경계가 아니다. 정규식은 우회된다. 막아야 할 것은 권한으로 막는다.
#
# 항목 필드:
#   id            : 짧은 식별자 (kebab-case)
#   pattern       : POSIX ERE (grep -E) 정규식. 한 명령 안에서 매칭되면 발동.
#                   `.*` 대신 `[^|;&]*` 를 쓴다 — `&&`·`;`·`|` 뒤의 다른 명령까지 번지지 않게.
#   match_all     : (선택) 같이 매칭돼야 차단 발동. 정규식 배열.
#   exclude       : (선택) 이 정규식이 매칭되면 차단하지 않는다 (ERE 에 부정 선행이 없어서 둔 자리).
#   ignore_quoted : (선택) true 면 작은따옴표·큰따옴표 안 문자열을 비우고 매칭한다.
#                   문자열 안의 텍스트(커밋 메시지, printf 인자)가 플래그로 읽히는 오탐을 막는다.
#                   파일 경로가 따옴표에 싸이는 패턴(secret-file-read)에는 켜지 않는다.
#   title         : 사용자에게 표시될 차단 사유 한 줄
#   reason        : 왜 금지인지 (사고 이력·정책)
#
# 추가/수정 시: hook 스크립트는 변경 없이 이 파일만 고치면 됨.

patterns:
  - id: protected-force-push
    # -f / --force / --force-with-lease, 또는 +refspec 강제 push. 브랜치는 push 인자 자리(공백 뒤, 선택적 `+`·`src:` 접두)에서만 본다 —
    # 옛 패턴은 명령 전체에서 main 을 찾아 `feature/main-fix` 도 막았다. 브랜치 인자를 생략한 push(현재 브랜치가 main)는 정적으로 못 잡는다.
    pattern: 'git[[:space:]]+push[[:space:]][^|;&]*(-f\b|--force\b|--force-with-lease\b|[[:space:]]\+[A-Za-z0-9_./-]+)'
    match_all:
      - 'push[^|;&]*[[:space:]]\+?([A-Za-z0-9_./-]+:)?(main|develop)([[:space:]]|$)'
    title: "main/develop force push"
    reason: "보호 브랜치 force push 금지. hotfix 브랜치 → PR로 처리."

  - id: reset-hard-remote
    pattern: "git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(origin|upstream)/"
    title: "git reset --hard <remote>/<branch>"
    reason: "원격 기준 강제 리셋은 작업 손실 위험. 백업·검토 후 수동으로."

  - id: protected-branch-delete
    pattern: 'git[[:space:]]+branch[[:space:]]+-D[[:space:]]+(main|develop)\b'
    title: "보호 브랜치 강제 삭제"
    reason: "main/develop 로컬 강제 삭제 차단."

  - id: commit-no-verify
    pattern: 'git[[:space:]]+commit[[:space:]][^|;&]*(\B-n\b|\B--no-verify\b)'
    ignore_quoted: true
    title: "git commit --no-verify"
    reason: "pre-commit hook 우회 금지. hook 실패 시 원인 수정 후 재커밋. (CLAUDE.md 정책)"

  - id: push-no-verify
    # commit-no-verify 와 같은 꼴. `-n` 은 push 에서 dry-run 이라 넣지 않는다(ADR-021 Q1 A 첫 적용).
    pattern: 'git[[:space:]]+push[[:space:]][^|;&]*\B--no-verify\b'
    ignore_quoted: true
    title: "git push --no-verify"
    reason: "pre-push hook 우회 금지. hook 실패 시 원인 수정 후 다시 push."

  - id: rm-rf-root-home
    # 플래그 순서·표기 무관(-rf · -fr · -r -f · --recursive), 경로는 따옴표·끝 슬래시 허용. 하위 경로는 아래 rm-recursive-force 가 -f 가 있을 때만 막는다.
    pattern: 'rm[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:]]+-[a-zA-Z-]+)*[[:space:]]+["'"'"']?(/|~|\$HOME|\$\{HOME\})/?["'"'"']?([[:space:]]|$)'
    title: "rm -rf 루트/홈 디렉터리"
    reason: "치명적 재귀 삭제 차단."

  - id: rm-recursive-force
    # 재귀(-r · -R · --recursive)와 강제(-f · --force)가 한 rm 에 같이 있으면 경로와 상관없이 막는다(#120). 위 항목은 -f 가 없어도 루트 · 홈을 막아서 따로 둔다.
    # -f 없는 rm -r 은 통과(#120 결정 1 B, 사용자). 플래그는 한 덩어리(-rf · -fr · -rfv) · 따로(-r -f) · 긴 이름 · 경로 뒤(rm a -rf) 모두 본다.
    # rm 은 명령 자리에서만 본다 — secret-file-read 와 같은 앞 덩어리에 셸 -c 따옴표 안(sh · bash · zsh · dash · ksh, -lc · -ec 같은 합친 플래그 포함) · eval 따옴표 안 · -exec(dir) 뒤를 더했다.
    # 앞에 붙는 낱말은 sudo · time · xargs · env · nohup 에 command · exec · eval · nice · timeout <시간> · 셸 키워드(do · then · else · elif · !)를 더했다.
    # 그래서 echo · printf · grep -c 같은 다른 명령의 따옴표 속 글자는 통과한다. ignore_quoted 는 켜지 않는다(sh -c 안을 봐야 한다).
    # 놓치는 꼴: git rm -rf · find -delete · 변수에 담은 rm($RM -rf) · 따옴표 친 명령 이름("rm" -rf) · GNU 약어(--recur --forc) · 위 목록 밖 낱말이 앞에 붙은 rm
    #   · 줄 이어 쓰기(\ 줄바꿈)로 rm 과 플래그가 다른 줄에 갈린 꼴 · 여러 줄 따옴표가 끝난 줄의 뒤 명령 · 스크립트 파일 안의 rm -rf(훅은 명령 문자열만 본다).
    # 지나치게 막는 꼴: grep 은 줄마다 봐서, 여러 줄 본문(heredoc · 여러 줄 따옴표)의 줄 처음이나 그 줄의 ( · 백틱 · ; | & { 뒤에 rm -rf 가 오면 막는다
    #   — 커밋 · PR 본문에 「(rm -rf)」 · 「`rm -rf`」를 쓴 줄이 여기 든다(「재귀 강제 삭제」로 풀어 쓰면 지나간다). 드물게 rm -r "$(ls -f)" · rm -r a # -f 도 막는다.
    pattern: ^(([^"'|;&(`{]|"[^"]*"|'[^']*')*([|;&(`{]+|"[^"]*\$\(|"[^"`]*`|((sh|bash|zsh|dash|ksh)([[:space:]]+-[a-zA-Z]+)*[[:space:]]+-[a-zA-Z]*c|eval)[[:space:]]+["']|-exec(dir)?[[:space:]]+))*[[:space:]]*(([A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*|(sudo|time|xargs|env|nohup|command|exec|eval|nice|do|then|else|elif|!)([[:space:]]+-[^[:space:]]*([[:space:]]+[^-[:space:]|;&"'][^[:space:]|;&"']*)?)*|timeout([[:space:]]+-[^[:space:]]*)*[[:space:]]+[0-9.]+[smhd]?)[[:space:]]+)*\\?([^[:space:]|;&"'/]*/)*rm(([[:space:]]+[^[:space:]|;&]+)*[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:]]+[^[:space:]|;&]+)*[[:space:]]+(-[a-zA-Z]*f[a-zA-Z]*|--force)|([[:space:]]+[^[:space:]|;&]+)*[[:space:]]+(-[a-zA-Z]*f[a-zA-Z]*|--force)([[:space:]]+[^[:space:]|;&]+)*[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)|([[:space:]]+[^[:space:]|;&]+)*[[:space:]]+-[a-zA-Z]*([rR][a-zA-Z]*f|f[a-zA-Z]*[rR])[a-zA-Z]*)([[:space:]]|$|[;|&)`"'])
    title: "rm -rf 재귀 강제 삭제 (경로 무관)"
    reason: "재귀 강제 삭제는 경로와 상관없이 막는다(예외 없음). 지울 필요가 없으면 남긴다 — 임시 폴더는 실행마다 새 이름으로 만든다. 꼭 지워야 하면 경로를 사람에게 알리고, 사람이 자기 터미널에서 지운다."

  - id: secret-file-read
    # 읽기 낱말은 명령 자리에서만 본다: 줄 처음, `|;&({` · 백틱 뒤, 큰따옴표 안 `$(` · 백틱 뒤. 그 자리를 찾을 때 따옴표 문자열은 한 덩어리로 건너뛴다.
    # 옛 패턴은 줄 어디든 읽기 낱말과 .env 글자가 있으면 막아서, 질문 본문 · PR 제목 속 글자와 `--head` 옵션도 막았다(#103).
    # 명령 자리 뒤에는 VAR=값, 앞에 붙는 낱말 sudo · time · xargs · env · nohup(옵션은 값 하나까지)을 건너뛰고, 읽기 낱말 앞의 `\` · 경로(/bin/)도 받는다.
    # 경로 인자는 따옴표째 본다(ignore_quoted 안 켬).
    # 놓치는 꼴: 위 목록 밖 낱말이 앞에 붙은 읽기, 따옴표 짝이 안 맞는 줄 — 여러 줄 따옴표 본문 뒤 둘째 줄의 읽기도 여기 든다(grep 은 줄마다 본다).
    # 지나치게 막는 꼴: `xargs -0 grep cat .env` 처럼 옵션 값 자리에 낱말이 낀 줄, 여러 줄 따옴표 본문의 둘째 줄이 읽기 낱말로 시작하는 줄.
    # 앞 덩어리는 `(…)*` 여야 모든 명령 자리를 본다(`?` 면 첫 구분자 뒤 한 자리만 본다).
    # 패턴에 두 종류 따옴표가 다 들어가 바깥 따옴표 없이 적는다. 훅 파서는 값 양끝의 따옴표 글자를 모두 벗기니 패턴 끝을 따옴표로 두지 않는다.
    pattern: ^(([^"'|;&(`{]|"[^"]*"|'[^']*')*([|;&(`{]+|"[^"]*\$\(|"[^"`]*`))*[[:space:]]*(([A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*|(sudo|time|xargs|env|nohup)([[:space:]]+-[^[:space:]]*([[:space:]]+[^-[:space:]|;&"'][^[:space:]|;&"']*)?)*)[[:space:]]+)*\\?([^[:space:]|;&"'/]*/)*(cat|less|more|head|tail|bat|xxd|nl|strings)[[:space:]][^|;&]*(\.env(\.[A-Za-z0-9_.-]+)?|id_rsa|id_ed25519|\.pem|\.p12|credentials(\.json)?)(\b|$)
    exclude: '\.env\.(example|sample|template|dist)\b'
    title: "비밀 파일 내용 출력 (.env·개인키·credentials)"
    reason: "환경변수·개인키·자격증명을 콘솔/로그로 노출 금지. 한 번 노출되면 회수·교체 비용이 크다. 값 확인은 안전한 경로로."
