name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 전체 테스트는 사람이 손으로 돌릴 때만 — Actions 화면의 Run workflow, 또는 scripts/release.sh 가 main 머리에서 발동한다(ADR-028)
  workflow_dispatch:

permissions:
  contents: read

# PR · main push 는 바뀐 부분만 돈다(hooks/test.sh --since, 표 hooks/test-map.tsv). 전체는 full 잡(수동 발동)에서만 돈다.
jobs:
  hooks:
    if: github.event_name != 'workflow_dispatch'
    # hooks/test.sh 는 macOS 에서만 돌려 왔다
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 훅 테스트 안의 임시 레포도 git commit 한다. 신원은 잡마다 같게 둔다
      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # 기준 커밋: PR 은 base 쪽 커밋, main push 는 push 직전 머리. 얕은 checkout 에는 없어서 그 커밋 하나만 더 받는다.
      # 못 받으면(지워진 커밋 · 첫 push 의 0000…) test_pick 이 「커밋을 읽을 수 없다」로 전부 돈다 — 놓치는 쪽으로 실패하지 않는다
      - name: base commit
        run: git fetch --no-tags --depth=1 origin "$BASE" || echo "기준 커밋 $BASE 를 못 받았다 — 전부 돈다"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # 바뀐 부분만. 러너 단위 테스트는 표가 고르면 여기서도 돈다(runner-unit 잡은 그대로 둔다)
      - name: test
        run: bash hooks/test.sh --since "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # 전부(러너 단위는 runner-unit 잡이 같은 실행 안에서 돈다)
      - name: test
        run: bash hooks/test.sh
        env:
          HOOK_TEST_PART: hooks

  runner-unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 러너(sdd_runner.py)가 테스트 안에서 신원 플래그 없이 git commit 한다. 신원을 못 찾으면 단위 테스트 26개가 깨진다
      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # SDD 러너 단위 테스트(hooks/tests/sdd-runner-unit.sh 만)
      - name: test
        run: bash hooks/test.sh
        env:
          HOOK_TEST_PART: runner
