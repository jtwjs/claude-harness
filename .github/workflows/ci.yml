name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# hooks/test.sh 를 두 잡으로 나눠 동시에 돌린다(HOOK_TEST_PART). 로컬 `bash hooks/test.sh` 는 지금처럼 전부 돈다.
jobs:
  hooks:
    # hooks/test.sh 는 macOS 에서만 돌려 왔다
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 훅 테스트 안의 임시 레포도 git commit 한다. 신원은 두 잡이 같게 둔다
      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # 훅 회귀(러너 단위 테스트를 뺀 hooks/test.sh 전부)
      - name: test
        run: bash hooks/test.sh
        env:
          HOOK_TEST_PART: hooks

  runner-unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 러너(sdd_runner.py)가 테스트 안에서 신원 플래그 없이 git commit 한다. 신원을 못 찾으면 단위 테스트 26개가 깨진다
      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # SDD 러너 단위 테스트(hooks/tests/sdd-runner-unit.sh 만)
      - name: test
        run: bash hooks/test.sh
        env:
          HOOK_TEST_PART: runner
